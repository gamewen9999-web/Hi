<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Manager</title>
  <link rel="stylesheet" href="style.css?v=20260608d">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- START SCREEN -->
    <div id="screen-start" class="screen active">
      <div class="start-bg">
        <div class="start-bg-overlay"></div>
        <div class="floating-balls">
          <div class="ball b1"></div>
          <div class="ball b2"></div>
          <div class="ball b3"></div>
        </div>
      </div>
      <div class="start-content">

        <!-- HOME MENU -->
        <div id="home-view" class="home-view">
          <div class="game-logo">
            <div class="logo-emblem"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="24" cy="24" r="21" fill="rgba(0,208,132,0.08)" stroke="#00d084" stroke-width="2"/><polygon points="24,15 31,20.5 28.5,28 19.5,28 17,20.5" fill="rgba(0,208,132,0.28)" stroke="#00d084" stroke-width="1.5" stroke-linejoin="round"/><line x1="24" y1="15" x2="24" y2="3.5" stroke="#00d084" stroke-width="1.5" stroke-linecap="round"/><line x1="31" y1="20.5" x2="41.5" y2="15" stroke="#00d084" stroke-width="1.5" stroke-linecap="round"/><line x1="28.5" y1="28" x2="36.5" y2="36.5" stroke="#00d084" stroke-width="1.5" stroke-linecap="round"/><line x1="19.5" y1="28" x2="11.5" y2="36.5" stroke="#00d084" stroke-width="1.5" stroke-linecap="round"/><line x1="17" y1="20.5" x2="6.5" y2="15" stroke="#00d084" stroke-width="1.5" stroke-linecap="round"/></svg></div>
            <h1 class="game-title">FOOTBALL<span>MANAGER</span></h1>
            <p class="game-subtitle">Beta 1.4.3</p>
          </div>
          <div id="home-menu" class="home-menu"></div>
        </div>

        <!-- CLUB SELECTOR -->
        <div id="club-selector-panel" class="club-selector-panel hidden">
          <div class="selector-header">
            <button class="btn-secondary btn-sm" id="btn-back-home">← Back</button>
            <h2 class="selector-title">Choose Your Club</h2>
          </div>
          <div class="country-tabs" id="country-tabs"></div>
          <div class="league-tabs" id="league-tabs"></div>
          <div class="search-bar">
            <input type="text" id="club-search" placeholder="Search clubs..." autocomplete="off">
            <span class="search-icon"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="6.5" cy="6.5" r="4.5"/><line x1="10" y1="10" x2="14.5" y2="14.5"/></svg></span>
          </div>
          <div id="clubs-grid" class="clubs-grid"></div>
        </div>

        <!-- CLUB CONFIRM -->
        <div id="club-confirm-panel" class="club-confirm-panel hidden">
          <div id="confirm-badge" class="confirm-badge"></div>
          <div class="confirm-info">
            <h2 id="confirm-name"></h2>
            <p id="confirm-league"></p>
            <div id="confirm-rep-stars" class="confirm-rep-stars"></div>
          </div>
          <div class="confirm-stats">
            <div class="cstat"><span class="cstat-label">Wage Budget</span><span class="cstat-val" id="confirm-wage"></span></div>
            <div class="cstat"><span class="cstat-label">Squad Rating</span><span class="cstat-val" id="confirm-rating"></span></div>
          </div>
          <div class="confirm-actions">
            <button class="btn-secondary" id="btn-back-select">← Change Club</button>
            <button class="btn-primary" id="btn-start-game">Start Career ➔</button>
          </div>
        </div>

      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="screen-game" class="screen hidden">
      <aside id="sidebar">
        <div class="sidebar-club">
          <div id="sb-badge" class="sb-badge"></div>
          <span id="sb-club-name" class="sb-name">Club</span>
          <span id="sb-league-name" class="sb-league">League</span>
          <div class="sb-stats-row">
            <div class="sb-mini-stat">
              <span id="sb-position" class="sb-mini-val sb-pos-val">—</span>
              <span class="sb-mini-label">Pos</span>
            </div>
            <div class="sb-stat-sep"></div>
            <div class="sb-mini-stat">
              <span id="sb-date" class="sb-mini-val">Aug 2024</span>
              <span class="sb-mini-label">Date</span>
            </div>
          </div>
        </div>
        <nav class="sidebar-nav">
          <button class="snav-btn active" data-view="dashboard">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg></span><span>Dashboard</span>
          </button>
          <button class="snav-btn" data-view="squad">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M2 14.5c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5"/></svg></span><span>Squad</span>
          </button>
          <button class="snav-btn" data-view="tactics">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><polygon points="8,1 15,8 8,15 1,8"/></svg></span><span>Tactics</span>
          </button>
          <button class="snav-btn" data-view="fixtures">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="1.5" y="3" width="13" height="12" rx="1.5"/><line x1="1.5" y1="7" x2="14.5" y2="7"/><line x1="5" y1="1" x2="5" y2="5"/><line x1="11" y1="1" x2="11" y2="5"/></svg></span><span>Fixtures</span>
          </button>
          <button class="snav-btn" data-view="table">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="10" width="4" height="5" rx="0.5"/><rect x="6.5" y="6" width="4" height="9" rx="0.5"/><rect x="11" y="2" width="4" height="13" rx="0.5"/></svg></span><span>League Table</span>
          </button>
          <button class="snav-btn" data-view="transfers">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,4.5 13,4.5 10.5,2"/><polyline points="13,11.5 3,11.5 5.5,14"/></svg></span><span>Transfers</span>
          </button>
          <button class="snav-btn" data-view="scout">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="6.5" r="4"/><line x1="9.5" y1="9.5" x2="14" y2="14"/><line x1="6.5" y1="3.5" x2="6.5" y2="4.5"/><line x1="6.5" y1="8.5" x2="6.5" y2="9.5"/><line x1="3.5" y1="6.5" x2="4.5" y2="6.5"/><line x1="8.5" y1="6.5" x2="9.5" y2="6.5"/></svg></span><span>Scout</span>
          </button>
          <button class="snav-btn" data-view="european">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><polygon points="8,1 10,6 15.5,6.5 11.5,10 13,15.5 8,12.5 3,15.5 4.5,10 0.5,6.5 6,6"/></svg></span><span>European</span>
          </button>
          <button class="snav-btn" data-view="finances">
            <span class="snav-icon"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1,13 5,8 9.5,10 14,3"/><polyline points="11.5,3 14,3 14,5.5"/></svg></span><span>Finances</span>
          </button>
        </nav>
        <div class="sidebar-bottom">
        </div>
      </aside>

      <main id="main-content">
        <!-- Views injected here by JS -->
      </main>
    </div>

    <!-- MATCH SCREEN -->
    <div id="screen-match" class="screen hidden">
      <div id="match-wrapper">
        <div id="match-header">
          <div class="match-teams">
            <div class="match-team home">
              <div id="match-home-badge" class="match-badge"></div>
              <span id="match-home-name">Home</span>
              <span id="match-home-color" class="team-color-swatch"></span>
            </div>
            <div class="match-scoreboard">
              <div id="match-score" class="match-score">0 – 0</div>
              <div id="match-time" class="match-time">0'</div>
              <div id="match-status" class="match-status">PRE-MATCH</div>
            </div>
            <div class="match-team away">
              <span id="match-away-color" class="team-color-swatch"></span>
              <span id="match-away-name">Away</span>
              <div id="match-away-badge" class="match-badge"></div>
            </div>
          </div>
        </div>
        <div id="match-body">
          <div id="match-pitch-side">
            <div id="match-pitch">
              <div class="pitch-markings">
                <div class="pm-border"></div>
                <div class="pm-halfway"></div>
                <div class="pm-center-circle"></div>
                <div class="pm-center-dot"></div>
                <div class="pm-penalty-left"></div>
                <div class="pm-goal-left"></div>
                <div class="pm-penalty-right"></div>
                <div class="pm-goal-right"></div>
              </div>
              <div id="pitch-events"></div>
              <div id="pitch-card"></div>
            </div>
            <div id="match-stats-bar">
              <div class="stat-row"><span id="s-possession-h">50%</span><div class="stat-bar-wrap"><div class="stat-bar-fill" id="stat-possession" style="width:50%"></div></div><span id="s-possession-a">50%</span><label>Possession</label></div>
              <div class="stat-row"><span id="s-shots-h">0</span><div class="stat-bar-wrap"><div class="stat-bar-fill" id="stat-shots" style="width:50%"></div></div><span id="s-shots-a">0</span><label>Shots</label></div>
              <div class="stat-row"><span id="s-sot-h">0</span><div class="stat-bar-wrap"><div class="stat-bar-fill" id="stat-sot" style="width:50%"></div></div><span id="s-sot-a">0</span><label>Shots on Target</label></div>
            </div>
          </div>
          <div id="match-events-panel">
            <!-- Halftime panel — shown only during the half-time break -->
            <div id="halftime-panel" class="hidden">
              <div class="ht-header">
                <div class="ht-title">Half Time</div>
                <div class="ht-halfscore" id="ht-score">0 – 0</div>
              </div>
              <div class="ht-tab-row">
                <button class="ht-tab-btn active" data-htab="tactics">Tactics</button>
                <button class="ht-tab-btn" data-htab="subs">Substitutions <span id="ht-subs-badge"></span></button>
              </div>
              <div id="ht-body" class="ht-body"></div>
            </div>
            <!-- Normal match events -->
            <div id="match-events-inner">
              <h3>Match Events</h3>
              <div id="match-events-list"></div>
            </div>
          </div>
        </div>
        <div id="match-controls">
          <button id="btn-simulate" class="btn-primary btn-lg">▶ Start Match</button>
          <button id="btn-halftime" class="btn-primary btn-lg hidden">▶ Second Half</button>
          <button id="btn-pause" class="btn-secondary btn-lg hidden">⏸ Pause</button>
          <button id="btn-speed" class="btn-secondary btn-lg hidden">2×</button>
          <button id="btn-subs" class="btn-secondary btn-lg hidden">⇄ Subs</button>
          <button id="btn-tactics" class="btn-secondary btn-lg hidden">⚙ Tactics</button>
        </div>
        <div id="match-result-overlay" class="hidden">
          <div class="result-box">
            <h2>Full Time</h2>
            <div class="result-score-big" id="result-score-big"></div>
            <div class="result-teams" id="result-teams"></div>
            <div id="result-scorers" class="result-scorers"></div>
            <div id="player-ratings-section" class="player-ratings-section"></div>
            <button class="btn-primary btn-lg" id="btn-continue-after-match">Continue ➔</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal-box" class="modal-box">
        <button id="modal-close" class="modal-close">✕</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <!-- NOTIFICATION TOAST -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
